<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced SSH Terminal - Multi-Server</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            z-index: 1000;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toolbar-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* Workspace Layout */
        .workspace {
            display: flex;
            height: calc(100vh - 60px);
            background: #1a1a1a;
        }

        /* Server Panel (Left Side) */
        .server-panel {
            width: 280px;
            background: #252525;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .server-panel-header {
            padding: 15px;
            background: #2a2a2a;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .server-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .add-server-btn {
            background: #667eea;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .add-server-btn:hover {
            background: #764ba2;
        }

        .server-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .server-item {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .server-item:hover {
            background: #333;
        }

        .server-item.active {
            background: #333;
            border-left-color: #667eea;
        }

        .server-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .server-name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .server-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .server-status.offline {
            background: #ef4444;
        }

        .server-host {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .server-uptime {
            font-size: 11px;
            color: #666;
        }

        /* Terminal Area (Center) */
        .terminal-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }

        /* Tab Bar */
        .tab-bar {
            background: #252525;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 10px;
            min-height: 42px;
        }

        .tab {
            background: transparent;
            border: none;
            padding: 10px 16px;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .tab.active {
            color: #fff;
            border-bottom-color: #667eea;
        }

        .tab-close {
            margin-left: 8px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .tab-close:hover {
            opacity: 1;
        }

        .new-tab-btn {
            background: transparent;
            border: none;
            padding: 10px 16px;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .new-tab-btn:hover {
            color: #fff;
        }

        /* Terminal Container */
        .terminal-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .terminal-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Scrollbar Styling */
        .server-list::-webkit-scrollbar {
            width: 8px;
        }

        .server-list::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .server-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .server-list::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        /* Loading State */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #888;
        }

        .loading i {
            font-size: 48px;
            margin-bottom: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #888;
        }

        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="toolbar-title">
                <i class="fas fa-terminal"></i>
                <span>Enhanced SSH Terminal</span>
            </div>
        </div>
        <div class="toolbar-right">
            <button class="toolbar-btn" onclick="openSettings()">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </button>
            <button class="toolbar-btn" onclick="openThemes()">
                <i class="fas fa-palette"></i>
                <span>Themes</span>
            </button>
        </div>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Server Panel -->
        <div class="server-panel">
            <div class="server-panel-header">
                <div class="server-panel-title">Servers</div>
                <button class="add-server-btn" onclick="addServer()">
                    <i class="fas fa-plus"></i> Add
                </button>
            </div>
            <div class="server-list" id="serverList">
                <!-- Server items will be added here -->
                <div class="empty-state">
                    <i class="fas fa-server"></i>
                    <h3>No Servers</h3>
                    <p>Click "Add" to create your first server</p>
                </div>
            </div>
        </div>

        <!-- Terminal Area -->
        <div class="terminal-area">
            <!-- Tab Bar -->
            <div class="tab-bar" id="tabBar">
                <!-- Tabs will be added here -->
                <button class="new-tab-btn" onclick="newTab()" title="New Tab">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <!-- Terminal Container -->
            <div class="terminal-container" id="terminalContainer">
                <div class="empty-state">
                    <i class="fas fa-terminal"></i>
                    <h3>No Active Session</h3>
                    <p>Add a server and click to connect</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let servers = [];
        let tabs = [];
        let activeTabId = null;

        // Load saved data
        function loadData() {
            const savedServers = localStorage.getItem('ssh_servers');
            if (savedServers) {
                servers = JSON.parse(savedServers);
                renderServerList();
            }
        }

        // Save data
        function saveData() {
            localStorage.setItem('ssh_servers', JSON.stringify(servers));
        }

        // Render server list
        function renderServerList() {
            const serverList = document.getElementById('serverList');
            
            if (servers.length === 0) {
                serverList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-server"></i>
                        <h3>No Servers</h3>
                        <p>Click "Add" to create your first server</p>
                    </div>
                `;
                return;
            }

            serverList.innerHTML = servers.map(server => `
                <div class="server-item" onclick="connectToServer('${server.id}')">
                    <div class="server-item-header">
                        <div class="server-name">
                            <span>${server.icon}</span>
                            <span>${server.name}</span>
                        </div>
                        <div class="server-status ${server.online ? '' : 'offline'}"></div>
                    </div>
                    <div class="server-host">${server.host}:${server.port}</div>
                    <div class="server-uptime">Uptime: ${server.uptime || 'Unknown'}</div>
                </div>
            `).join('');
        }

        // Add server
        function addServer() {
            const name = prompt('Server Name:', 'Production Server');
            if (!name) return;

            const host = prompt('Host/IP:', 'panel.cloudmc.online');
            if (!host) return;

            const port = prompt('Port:', '7681');
            if (!port) return;

            const server = {
                id: 'server_' + Date.now(),
                name: name,
                host: host,
                port: port,
                icon: '🔴',
                online: true,
                uptime: '0d 0h 0m'
            };

            servers.push(server);
            saveData();
            renderServerList();
        }

        // Connect to server
        function connectToServer(serverId) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;

            // Create new tab for this server
            const tabId = 'tab_' + Date.now();
            const tab = {
                id: tabId,
                serverId: serverId,
                serverName: server.name,
                serverIcon: server.icon,
                url: `https://${server.host}:${server.port}`
            };

            tabs.push(tab);
            activeTabId = tabId;
            renderTabs();
            renderTerminal();
        }

        // Render tabs
        function renderTabs() {
            const tabBar = document.getElementById('tabBar');
            
            const tabsHTML = tabs.map(tab => {
                const server = servers.find(s => s.id === tab.serverId);
                return `
                    <button class="tab ${tab.id === activeTabId ? 'active' : ''}" 
                            onclick="switchTab('${tab.id}')">
                        <span>${server ? server.icon : '🖥️'}</span>
                        <span>${tab.serverName}</span>
                        <span class="tab-close" onclick="closeTab(event, '${tab.id}')">
                            <i class="fas fa-times"></i>
                        </span>
                    </button>
                `;
            }).join('');

            tabBar.innerHTML = tabsHTML + `
                <button class="new-tab-btn" onclick="newTab()" title="New Tab">
                    <i class="fas fa-plus"></i>
                </button>
            `;
        }

        // Switch tab
        function switchTab(tabId) {
            activeTabId = tabId;
            renderTabs();
            renderTerminal();
        }

        // Close tab
        function closeTab(event, tabId) {
            event.stopPropagation();
            tabs = tabs.filter(t => t.id !== tabId);
            
            if (activeTabId === tabId) {
                activeTabId = tabs.length > 0 ? tabs[0].id : null;
            }
            
            renderTabs();
            renderTerminal();
        }

        // New tab
        function newTab() {
            if (servers.length === 0) {
                alert('Please add a server first');
                return;
            }
            // For now, just show message
            alert('Select a server from the left panel to open a new connection');
        }

        // Render terminal
        function renderTerminal() {
            const container = document.getElementById('terminalContainer');
            
            if (!activeTabId) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-terminal"></i>
                        <h3>No Active Session</h3>
                        <p>Add a server and click to connect</p>
                    </div>
                `;
                return;
            }

            const activeTab = tabs.find(t => t.id === activeTabId);
            if (!activeTab) return;

            container.innerHTML = `
                <iframe class="terminal-frame" src="${activeTab.url}"></iframe>
            `;
        }

        // Settings
        function openSettings() {
            alert('Settings panel coming in next step!');
        }

        // Themes
        function openThemes() {
            alert('Theme selector coming in next step!');
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
